name: External Intelligence Results

on:
  workflow_run:
    workflows:
      - CI
      - Cloudflare Production
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  record:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record verified development result in EIS
        env:
          EIS_BASE_URL: https://external-intelligence-system.vercel.app
          WORKSPACE_ID: professional-platform-dev
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$SOURCE_WORKFLOW" = "Cloudflare Production" ]; then
            TASK_TYPE="production-deploy"
            SUMMARY="Feedback Hub Production workflow completed typecheck, tests, build, D1 migrations, and deploy."
            KNOWLEDGE_TITLE="Feedback Hub production workflow completed"
            KNOWLEDGE_STATEMENT="The current Feedback Hub commit completed its configured Production build, migrations, and deployment. The workflow does not currently verify Production UI reachability, permissions, D1 readback/roundtrip, AI Platform Core integration, or human-visible behavior, so this remains deployment evidence only."
            FINGERPRINT='{"runtime":"cloudflare-workers","database":"cloudflare-d1","environment":"production","planModel":"free-pro-business-contract","appRole":"feedback-intake","nodeVersion":"22"}'
            VERIFICATION='{"productionDeployed":true,"uiReachable":false,"permissionVerified":false,"requiresPersistence":true,"persistenceVerified":false,"requiresIntegration":true,"integrationVerified":false,"humanVerified":false}'
          else
            TASK_TYPE="ci-validation"
            SUMMARY="Feedback Hub main CI passed typecheck and tests."
            KNOWLEDGE_TITLE="Feedback Hub main CI validation completed"
            KNOWLEDGE_STATEMENT="The current Feedback Hub main commit passed typecheck and tests. This is implementation evidence only and does not prove Production deployment, persistence/readback, AI Platform Core integration, UI reachability, permissions, or human verification."
            FINGERPRINT='{"runtime":"cloudflare-workers","database":"cloudflare-d1","environment":"ci","planModel":"free-pro-business-contract","appRole":"feedback-intake","nodeVersion":"22"}'
            VERIFICATION='{"productionDeployed":false,"uiReachable":false,"permissionVerified":false,"requiresPersistence":true,"persistenceVerified":false,"requiresIntegration":true,"integrationVerified":false,"humanVerified":false}'
          fi

          oidc_response="$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fexternal-intelligence-system.vercel.app")"
          EIS_TOKEN="$(printf '%s' "$oidc_response" | jq -r '.value // empty')"
          if [ -z "$EIS_TOKEN" ]; then
            echo 'External Intelligence: NOT CONNECTED (GitHub OIDC token missing)'
            exit 0
          fi

          EVIDENCE_URI="${{ github.server_url }}/${{ github.repository }}/actions/runs/$SOURCE_RUN_ID"
          payload="$(jq -n \
            --arg workspaceId "$WORKSPACE_ID" \
            --arg projectId "feedback-hub" \
            --arg appId "feedback-hub" \
            --arg componentId "hub" \
            --arg repository "$SOURCE_REPOSITORY" \
            --arg commitSha "$SOURCE_COMMIT" \
            --arg taskType "$TASK_TYPE" \
            --arg summary "$SUMMARY" \
            --arg knowledgeTitle "$KNOWLEDGE_TITLE" \
            --arg knowledgeStatement "$KNOWLEDGE_STATEMENT" \
            --arg evidenceUri "$EVIDENCE_URI" \
            --argjson fingerprint "$FINGERPRINT" \
            --argjson verification "$VERIFICATION" \
            '{workspaceId:$workspaceId,projectId:$projectId,appId:$appId,componentId:$componentId,repository:$repository,commitSha:$commitSha,taskType:$taskType,summary:$summary,outcome:"implementation_result",success:true,source:"github_actions",knowledgeTitle:$knowledgeTitle,knowledgeStatement:$knowledgeStatement,evidenceUri:$evidenceUri,fingerprint:$fingerprint,verification:$verification}')"

          http_code="$(curl --silent --show-error --output /tmp/eis-response.json --write-out '%{http_code}' \
            --request POST "${EIS_BASE_URL%/}/api/development/results" \
            --header 'content-type: application/json' \
            --header "authorization: Bearer $EIS_TOKEN" \
            --data "$payload" || true)"

          if [[ "$http_code" =~ ^2 ]]; then
            echo 'External Intelligence: RECORDED (github_oidc)'
            cat /tmp/eis-response.json
            exit 0
          fi

          echo "External Intelligence: NOT CONNECTED (github_oidc, HTTP $http_code)" >&2
          if [ -f /tmp/eis-response.json ]; then cat /tmp/eis-response.json >&2; fi
          exit 0
